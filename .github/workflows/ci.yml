name: build

on:
  # 작업 브랜치(feat/*, fix/*)는 PR 이벤트로만 검사 → 중복 실행 방지
  push:
    branches: [develop]
  pull_request:

jobs:
  native:
    # 기존 세 항목의 잡 이름은 그대로다 (develop 보호 규칙의 필수 검사가 이름으로 걸려 있다). event 가 있는 항목만 이름 뒤에 붙는다
    name: ${{ matrix.os }} / ${{ matrix.cc }}${{ matrix.event && format(' / {0}', matrix.event) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
          # 이벤트 백엔드 (docs/event-backend.md). 필수 검사가 아니다
          - { os: ubuntu-latest, cc: gcc,   event: epoll }
          - { os: macos-latest,  cc: clang, event: kqueue }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make CC=${{ matrix.cc }} WERROR=1 EVENT=${{ matrix.event }}
      - name: Test
        run: make test CC=${{ matrix.cc }} EVENT=${{ matrix.event }}

  alpine:
    name: alpine (musl) / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 로컬과 동일한 docker/alpine.Dockerfile 사용
      - name: Build & test in Alpine container
        run: make docker-test DISTRO=alpine CC=${{ matrix.cc }} WERROR=1

  # 필수 검사는 아니다 (보호 규칙의 5개에 포함 안 됨). 실패하면 PR 에서 원인을 확인한다
  asan:
    name: ubuntu / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build & test with sanitizers
        run: make asan WERROR=1
      # 같은 build/asan 안에서 백엔드만 바꿔 다시 링크된다 (EVENT 스탬프)
      - name: Build & test with sanitizers (epoll)
        run: make asan WERROR=1 EVENT=epoll
