name: build

on:
  # 작업 브랜치(feat/*, fix/*)는 PR 이벤트로만 검사 → 중복 실행 방지
  push:
    branches: [develop]
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make CC=${{ matrix.cc }} WERROR=1
      - name: Test
        run: make test CC=${{ matrix.cc }}

  alpine:
    name: alpine (musl) / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 로컬과 동일한 docker/alpine.Dockerfile 사용
      - name: Build & test in Alpine container
        run: make docker-test DISTRO=alpine CC=${{ matrix.cc }} WERROR=1
